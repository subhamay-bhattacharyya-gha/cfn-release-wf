name: CloudFormation CI Reusable Workflow
description: "Reusable workflow for CloudFormation CI/CD pipeline with validation, linting, scanning, building, and deployment capabilities"

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
        description: "Environment to deploy to (e.g., ci, devl, test, prod)."
      cfn-directory:
        type: string
        required: true
        default: 'cfn'
        description: "Directory containing CloudFormation template files."
      ci-build:
        type: boolean
        required: false
        default: true
        description: "Indicates if this is a CI build run."
    secrets:
      aws-role-arn:
        required: true
        description: "AWS role ARN for assuming a role."
    outputs:
      template-path:
        description: "Path to the CloudFormation template file"
        value: ${{ jobs.execution-path.outputs.template-path }}

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: us-east-1

jobs:
  detect-changes:
    name: "🔎 Detect Changes"
    runs-on: ubuntu-latest
    outputs:
      files-changed: ${{ steps.list-changed-files.outputs.files-changed }}
      json-output: ${{ steps.list-changed-files.outputs.json-output }}
      has-changes: ${{ steps.list-changed-files.outputs.has-changes }}
    steps:
      - name: List updated files
        id: list-changed-files
        uses: subhamay-bhattacharyya-gha/list-updated-files-action@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  detect-services:
    name: "🔎 Detect Services"
    runs-on: ubuntu-latest
    outputs:
      services-used: ${{ steps.scan.outputs.services-used }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Scan AWS Services
        id: scan
        uses: subhamay-bhattacharyya-gha/scan-aws-services-action@main

      - name: Save Detected Services to Environment Variable
        run: |
          echo "Detected Services: ${{ steps.scan.outputs.services-used }}"
          echo 'SERVICES_USED=${{ steps.scan.outputs.services-used }}' >> $GITHUB_ENV

      - name: Print AWS Service Detection Table
        run: |
          echo "## AWS Services Detected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service               | Used |" >> $GITHUB_STEP_SUMMARY
          echo "|------------------------|------|" >> $GITHUB_STEP_SUMMARY
          echo "🔍 Raw SERVICES_USED: $SERVICES_USED"
          node -e "
          try {
            const raw = process.env.SERVICES_USED;
            const result = JSON.parse(raw);
            const emoji = (val) => val ? '✅' : '❌';
            const rows = Object.entries(result).map(([key, val]) => \`| \${key.padEnd(22)} | \${emoji(val)} |\`).join('\n');
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, rows + '\n');
          } catch (e) {
            console.error('❌ Failed to parse SERVICES_USED:', e.message);
            console.error('💥 Value received:', process.env.SERVICES_USED);
            process.exit(1);
          }"

  execution-path:
    name: "Execution Path"
    runs-on: ubuntu-latest
    needs: [detect-services, detect-changes]
    outputs:
      execution-path: ${{ steps.read-config.outputs.execution-path }}
      template-path: ${{ steps.read-config.outputs.template-path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read CloudFormation template configuration
        id: read-config
        run: |
          # Set default values
          EXECUTION_PATH="deploy"
          TEMPLATE_PATH=""
          
          # Check if cfn-directory exists
          if [ -d "${{ inputs.cfn-directory }}" ]; then
            # Look for CloudFormation template files
            TEMPLATE_FILES=$(find ${{ inputs.cfn-directory }} -name "*.yaml" -o -name "*.yml" -o -name "*.json" | head -1)
            
            if [ -n "$TEMPLATE_FILES" ]; then
              TEMPLATE_PATH="$TEMPLATE_FILES"
              echo "Found CloudFormation template: $TEMPLATE_PATH"
              
              # Determine execution path based on changes and services
              if [ "${{ needs.detect-changes.outputs.has-changes }}" == "true" ] || [ "${{ inputs.ci-build }}" == "true" ]; then
                EXECUTION_PATH="deploy"
              else
                EXECUTION_PATH="validate-only"
              fi
            else
              echo "No CloudFormation templates found in ${{ inputs.cfn-directory }}"
              EXECUTION_PATH="validate-only"
            fi
          else
            echo "CloudFormation directory ${{ inputs.cfn-directory }} does not exist"
            EXECUTION_PATH="validate-only"
          fi
          
          echo "execution-path=$EXECUTION_PATH" >> $GITHUB_OUTPUT
          echo "template-path=$TEMPLATE_PATH" >> $GITHUB_OUTPUT
          
          echo "Execution path: $EXECUTION_PATH"
          echo "Template path: $TEMPLATE_PATH"

  cloudformation-validate:
    name: "CloudFormation Validate"
    runs-on: ubuntu-latest
    needs: [execution-path]
    if: needs.execution-path.outputs.template-path != ''
    outputs:
      tags: ${{ steps.check-artifact.outcome == 'success' && steps.read-existing-params.outputs.tags || steps.prepare-params.outputs.tags }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          role-session-name: cloudformation-validation-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check for Existing Deployment Parameters Artifact
        id: check-artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: deployment-parameters
          path: ./artifacts

      - name: Prepare CloudFormation Parameters
        id: prepare-params
        if: steps.check-artifact.outcome == 'failure'
        uses: subhamay-bhattacharyya-gha/cfn-stack-params-action@main
        with:
          cfn-directory: ${{ inputs.cfn-directory }}
          ci-build: ${{ inputs.ci-build }}
          environment: 'ci'

      - name: Read Existing Deployment Parameters
        id: read-existing-params
        if: steps.check-artifact.outcome == 'success'
        shell: bash
        run: |
          echo "📋 Using existing deployment parameters from artifact..."
          if [ -f "./artifacts/deployment.json" ]; then
            echo "✅ Found existing deployment.json file"
            cat ./artifacts/deployment.json
            
            # Extract values from JSON
            PARAMETERS=$(jq -c '.parameters' ./artifacts/deployment.json)
            STACK_NAME=$(jq -r '."stack-name"' ./artifacts/deployment.json)
            TEMPLATE_PATH=$(jq -r '."template-path"' ./artifacts/deployment.json)
            TAGS=$(jq -c '.tags // {}' ./artifacts/deployment.json)
            
            echo "📋 Extracted Parameters from existing artifact:"
            echo "Parameters: $PARAMETERS"
            echo "Stack Name: $STACK_NAME"
            echo "Template Path: $TEMPLATE_PATH"
            echo "Tags: $TAGS"
            
            # Set as step outputs to match prepare-params outputs
            echo "parameters=$PARAMETERS" >> $GITHUB_OUTPUT
            echo "stack-name=$STACK_NAME" >> $GITHUB_OUTPUT
            echo "template-path=$TEMPLATE_PATH" >> $GITHUB_OUTPUT
            echo "tags=$TAGS" >> $GITHUB_OUTPUT
          else
            echo "❌ deployment.json file not found in artifact"
            exit 1
          fi

      - name: Print Stack Name
        run: |
          echo "Stack name:"
          if [ "${{ steps.check-artifact.outcome }}" == "success" ]; then
            echo "Stack Name (from existing artifact): ${{ steps.read-existing-params.outputs.stack-name }}"
          else
            echo "Stack Name (from prepared params): ${{ steps.prepare-params.outputs.stack-name }}"
          fi
          echo "Template Path : ${{ needs.execution-path.outputs.template-path }}"

      - name: Validate CloudFormation Template
        uses: subhamay-bhattacharyya-gha/cfn-validate-action@main
        with:
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          cloudformation-dir: ${{ inputs.cfn-directory }}
          template-file: ${{ needs.execution-path.outputs.template-path }}
          aws-region: ${{ vars.AWS_REGION }}

  cloudformation-lint:
    if: ${{ needs.execution-path.result == 'success' && needs.execution-path.outputs.execution-path && fromJSON(needs.execution-path.outputs.execution-path).IaC == true }}
    name: "📋 CloudFormation Lint"
    runs-on: ubuntu-latest
    needs: [execution-path]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install cfn-lint
        run: |
          pip install cfn-lint

      - name: Run CloudFormation Lint
        uses: subhamay-bhattacharyya-gha/cfn-lint-action@main
        with:
          template-path: ${{ needs.execution-path.outputs.template-path }}

  checkov-scan:
    if: ${{ needs.execution-path.result == 'success' && needs.execution-path.outputs.execution-path && fromJSON(needs.execution-path.outputs.execution-path).IaC == true }}
    name: "🧳 Checkov Scan"
    runs-on: ubuntu-latest
    needs: [execution-path]
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Checkov Scan
        uses: subhamay-bhattacharyya-gha/checkov-scan-action@main
        id: checkov-scan
        with:
          iac-dir: ${{ inputs.cfn-directory }}
          iac-framework: cloudformation
          soft-fail: true

      - name: Confirm SARIF file type
        shell: bash
        run: |
          ls -la "${{ github.workspace }}"
          file "${{ github.workspace }}/results.sarif"

      - name: "📋 Summarize and Print Checkov Scan Report with Snippets"
        id: summarize-report
        uses: subhamay-bhattacharyya-gha/checkov-report-action@main

  build-lambda:
    name: "🛠️ ⛔ Lambda Package"
    if: ${{ needs.execution-path.result == 'success' && needs.execution-path.outputs.execution-path && fromJSON(needs.execution-path.outputs.execution-path).lambda == true }}
    runs-on: ubuntu-latest
    needs: [execution-path, detect-services, detect-changes]
    steps:
      - name: Build and Upload Lambda Package
        run: echo "Uploading Lambda package..."

  build-lambda-layer:
    name: "🛠️ ⛔ Lambda Layer"
    if: ${{ needs.execution-path.result == 'success' && needs.execution-path.outputs.execution-path && fromJSON(needs.execution-path.outputs.execution-path)['lambda-layer'] == true }}
    runs-on: ubuntu-latest
    needs: [execution-path, detect-services, detect-changes]
    steps:
      - name: Build Lambda Layer Package
        run: echo "No changes in Lambda layer package, skipping build..."

      - name: Build and Upload Lambda Layer Package
        run: echo "Build and Upload Lambda layer...."

  build-glue:
    name: "🛠️ ⛔ Glue Script"
    if: ${{ needs.execution-path.result == 'success' && needs.execution-path.outputs.execution-path && fromJSON(needs.execution-path.outputs.execution-path).glue == true }}
    runs-on: ubuntu-latest
    needs: [execution-path, detect-services, detect-changes]
    steps:
      - name: Package Glue Script
        run: echo "No changes found in Glue script, skipping build..."

      - name: Package and Upload Glue Script
        run: echo "Uploading Glue script..."

  build-state-machine:
    name: "🛠️ ⛔ State Machine"
    if: ${{ needs.execution-path.result == 'success' && needs.execution-path.outputs.execution-path && fromJSON(needs.execution-path.outputs.execution-path)['state-machine'] == true }}
    runs-on: ubuntu-latest
    needs: [execution-path, detect-services, detect-changes]
    steps:
      - name: Package State Machine
        run: echo "No changes in State Machine, skipping build."

      - name: Upload State Machine ASL
        run: echo "Uploading State Machine ASL..."

  cloudformation-create:
    if: ${{ needs.cloudformation-lint.result == 'success' && needs.cloudformation-validate.result == 'success' && needs.checkov-scan.result == 'success' }}
    name: "🚧 CloudFormation Create Stack"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs: [cloudformation-lint, cloudformation-validate, checkov-scan]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Deployment Parameters Artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-parameters
          path: ./artifacts

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          role-session-name: cloudformation-create-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Read Deployment Parameters
        id: read-params
        shell: bash
        run: |
          echo "📋 Reading deployment parameters from artifact..."
          if [ -f "./artifacts/deployment.json" ]; then
            echo "✅ Found deployment.json file"
            cat ./artifacts/deployment.json
            
            # Extract values from JSON
            PARAMETERS=$(jq -c '.parameters' ./artifacts/deployment.json)
            STACK_NAME=$(jq -r '."stack-name"' ./artifacts/deployment.json)
            TEMPLATE_PATH=$(jq -r '."template-path"' ./artifacts/deployment.json)
            TAGS=$(jq -c '.tags // {}' ./artifacts/deployment.json)
            
            echo "📋 Extracted values from artifact:"
            echo "Parameters: $PARAMETERS"
            echo "Stack Name: $STACK_NAME"
            echo "Template Path: $TEMPLATE_PATH"
            echo "Tags: $TAGS"
            
            # Set as environment variables for use in subsequent steps
            echo "DEPLOYMENT_PARAMETERS=$PARAMETERS" >> $GITHUB_ENV
            echo "DEPLOYMENT_STACK_NAME=$STACK_NAME" >> $GITHUB_ENV
            echo "DEPLOYMENT_TEMPLATE_PATH=$TEMPLATE_PATH" >> $GITHUB_ENV
            echo "DEPLOYMENT_TAGS=$TAGS" >> $GITHUB_ENV
            
            # Set as step outputs
            echo "parameters=$PARAMETERS" >> $GITHUB_OUTPUT
            echo "stack-name=$STACK_NAME" >> $GITHUB_OUTPUT
            echo "template-path=$TEMPLATE_PATH" >> $GITHUB_OUTPUT
            echo "cloudformation-tags=$TAGS" >> $GITHUB_OUTPUT
          else
            echo "❌ deployment.json file not found in artifact"
            exit 1
          fi

      - name: Deploy CloudFormation Stack
        uses: subhamay-bhattacharyya-gha/cfn-create-stack-action@main
        with:
          stack-name: ${{ steps.read-params.outputs.stack-name }}
          template-path: ${{ steps.read-params.outputs.template-path }}
          deployment-parameters: ${{ steps.read-params.outputs.parameters }}
          cloudformation-tags: ${{ steps.read-params.outputs.cloudformation-tags }}

  cloudformation-delete:
    if: ${{ needs.cloudformation-create.result == 'success' }}
    name: " ✂️ CloudFormation Destroy"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs: [cloudformation-create]
    steps:
      - name: Download Deployment Parameters Artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-parameters
          path: ./artifacts

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          role-session-name: cloudformation-delete-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Read Deployment Parameters
        id: read-params
        uses: subhamay-bhattacharyya-gha/cfn-read-deployment-params-action@main
        with:
          artifact-path: './artifacts/deployment.json'

      - name: CloudFormation Delete Stack
        uses: subhamay-bhattacharyya-gha/cfn-delete-stack-action@main
        with:
          stack-name: ${{ env.DEPLOYMENT_STACK_NAME }}
          aws-region: ${{ vars.AWS_REGION }}

  create-release:
    name: "Create Release"
    runs-on: ubuntu-latest
    needs: [detect-changes, detect-services, execution-path, cloudformation-validate, cloudformation-lint, checkov-scan, build-lambda, build-lambda-layer, build-glue, build-state-machine, cloudformation-create, cloudformation-delete]
    if: always() && (needs.detect-changes.result == 'success' || needs.detect-changes.result == 'skipped') && (needs.detect-services.result == 'success' || needs.detect-services.result == 'skipped') && (needs.execution-path.result == 'success' || needs.execution-path.result == 'skipped') && (needs.cloudformation-validate.result == 'success' || needs.cloudformation-validate.result == 'skipped') && (needs.cloudformation-lint.result == 'success' || needs.cloudformation-lint.result == 'skipped') && (needs.checkov-scan.result == 'success' || needs.checkov-scan.result == 'skipped') && (needs.build-lambda.result == 'success' || needs.build-lambda.result == 'skipped') && (needs.build-lambda-layer.result == 'success' || needs.build-lambda-layer.result == 'skipped') && (needs.build-glue.result == 'success' || needs.build-glue.result == 'skipped') && (needs.build-state-machine.result == 'success' || needs.build-state-machine.result == 'skipped') && (needs.cloudformation-create.result == 'success' || needs.cloudformation-create.result == 'skipped') && (needs.cloudformation-delete.result == 'success' || needs.cloudformation-delete.result == 'skipped')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create release
        uses: subhamay-bhattacharyya-gha/create-release-action@feature/GHA-0002-initial-release
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}